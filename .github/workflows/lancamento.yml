# Lançamento das 5 edições do Yoru ao mesmo tempo: Windows, macOS, Linux, Android e Web.
#
# Roda AQUI (repositório público de downloads), não no repositório do código: os segredos ficam com quem lança e
# repositório público não gasta minutos do GitHub Actions. O código vem do repositório privado Yoru-team/Yoru por
# uma chave de implantação só de leitura (segredo YORU_SOURCE_DEPLOY_KEY).
#
# Como lançar: aba Actions > "Lançamento" > Run workflow, informando a versão (igual à do package.json) e o branch.
# Passo a passo e segredos: docs/lancamento-automatico.md no repositório do código.
#
# Ordem: verificar -> desktop (3 sistemas) + android -> publicar (release e índice) -> site (Cloudflare e/ou Firebase,
# conforme os segredos cadastrados).
# Se algo falhar antes de publicar, nada sai: ninguém recebe uma versão pela metade.
#
# Os registros (logs) deste repositório são públicos: nenhum passo imprime segredo, e os artefatos intermediários
# (os mesmos instaladores que vão para a release) somem em 3 dias.
name: Lançamento

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão (igual à do package.json): 1.1.0 ou 1.1.0-beta.1'
        required: true
        type: string
      ref:
        description: 'Branch, tag ou commit do código no Yoru-team/Yoru'
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: lancamento
  cancel-in-progress: false

env:
  SOURCE_REPO: Yoru-team/Yoru
  VERSAO: ${{ inputs.versao }}
  TAG: v${{ inputs.versao }}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      site: ${{ steps.site.outputs.publicar }}
      cloudflare: ${{ steps.site.outputs.cloudflare }}
      firebase: ${{ steps.site.outputs.firebase }}
    steps:
      - name: Versão no formato certo
        run: |
          echo "$VERSAO" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' || { echo "::error::Versão inválida: $VERSAO"; exit 1; }
      - name: Segredos cadastrados
        env:
          YORU_SOURCE_DEPLOY_KEY: ${{ secrets.YORU_SOURCE_DEPLOY_KEY }}
          YORU_PUBLISHER_KEY: ${{ secrets.YORU_PUBLISHER_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          falta=""
          for s in YORU_SOURCE_DEPLOY_KEY YORU_PUBLISHER_KEY ANDROID_KEYSTORE_BASE64 \
                   ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!s}" ] || falta="$falta $s"
          done
          if [ -n "$falta" ]; then echo "::error::Segredos não cadastrados:$falta"; exit 1; fi
      # o site é opcional: sem nenhum dos segredos, as outras 4 edições saem e o site fica para depois.
      # Cloudflare (yoruapp.com.br, 2026-10+) é o endereço novo; o Firebase (yoru-call.web.app) continua recebendo o mesmo
      # build enquanto o endereço antigo estiver no ar, e lá o próprio app mostra o aviso de mudança.
      - id: site
        name: Site (Cloudflare e Firebase)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_YORU__APP }}
        run: |
          cf=false; fb=false
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then cf=true; fi
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then fb=true; fi
          echo "cloudflare=$cf" >> "$GITHUB_OUTPUT"
          echo "firebase=$fb" >> "$GITHUB_OUTPUT"
          if [ "$cf" = true ] || [ "$fb" = true ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem os segredos da Cloudflare nem do Firebase: este lançamento não publica o site."
          fi
          [ "$cf" = true ] || echo "::warning::Sem CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID: o site não vai para yoruapp.com.br."
      - name: Essa versão ainda não foi lançada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A versão $VERSAO já foi lançada. Suba a versão no package.json."; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.YORU_SOURCE_DEPLOY_KEY }}
      # todos os jobs usam exatamente este commit, mesmo que o branch receba algo no meio do lançamento
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: A versão é a do package.json
        run: |
          V=$(node -p "require('./package.json').version")
          [ "$V" = "$VERSAO" ] || { echo "::error::O package.json está na versão $V, não $VERSAO."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:cloud

  desktop:
    needs: verificar
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            edicao: windows
          - os: macos-latest
            edicao: macos
          - os: ubuntu-latest
            edicao: linux
    runs-on: ${{ matrix.os }}
    env:
      MAIN_VITE_KLIPY_KEY: ${{ secrets.KLIPY_KEY }}
      MAIN_VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      MAIN_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # sem certificado da Apple: o .app sai com assinatura ad hoc (mac.identity "-")
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.verificar.outputs.commit }}
          ssh-key: ${{ secrets.YORU_SOURCE_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run build
      - run: node scripts/dist.mjs
      - name: Assinar o manifesto de atualização
        shell: bash
        env:
          YORU_PUBLISHER_KEY: ${{ secrets.YORU_PUBLISHER_KEY }}
        run: |
          V="$VERSAO"
          case "${{ matrix.edicao }}" in
            windows) node scripts/release.mjs --skip-build --platform win32-x64 --file "dist/Yoru-Setup-$V.exe" ;;
            macos)
              node scripts/release.mjs --skip-build --platform darwin-x64 --file "dist/Yoru-$V-x64.dmg"
              node scripts/release.mjs --skip-build --platform darwin-arm64 --file "dist/Yoru-$V-arm64.dmg" ;;
            linux) node scripts/release.mjs --skip-build --platform linux-x64 --file "dist/Yoru-$V.AppImage" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.edicao }}
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.update.json

  android:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.verificar.outputs.commit }}
          ssh-key: ${{ secrets.YORU_SOURCE_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:web
      - run: npx cap sync android
      - name: Gerar e assinar o APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yoru.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/yoru.jks"
          V="$VERSAO"
          CODE=$(node -e "const [c,p]=process.argv[1].split('-');const [a,b,d]=c.split('.').map(Number);console.log(a*1e6+b*1e4+d*100+(p?Number(p.split('.')[1]):99))" "$V")
          (cd android && ./gradlew --no-daemon assembleRelease -PyoruVersionCode="$CODE" -PyoruVersionName="$V")
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk "dist-android/Yoru-$V.apk"
          rm -f "$RUNNER_TEMP/yoru.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          retention-days: 3
          path: dist-android/*.apk

  publicar:
    needs: [verificar, desktop, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # só este job escreve no repositório (release + índice), com o token do próprio Actions
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.verificar.outputs.commit }}
          ssh-key: ${{ secrets.YORU_SOURCE_DEPLOY_KEY }}
          path: fonte
      - uses: actions/checkout@v4
        with:
          path: downloads
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true
      - name: Índice do canal
        run: |
          # endereço ANTIGO dos downloads de propósito: os apps até a 1.1.2 só aceitam atualização que comece com
          # https://github.com/EmannuelVitor/Yoru-releases/releases/download/ (o GitHub redireciona para o Yoru-team).
          # A 1.2.0+ aceita os dois; troque para "$GITHUB_REPOSITORY" quando quase todos estiverem na 1.2.0+.
          node fonte/scripts/release-index.mjs --dir artefatos --out downloads/latest --tag "$TAG" \
            --repo EmannuelVitor/Yoru-releases --notes-out notas.md
      - name: Release com os instaladores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BETA=""
          case "$VERSAO" in *-beta.*) BETA="--prerelease" ;; esac
          gh release create "$TAG" artefatos/* --repo "$GITHUB_REPOSITORY" --target main --title "Yoru $VERSAO" \
            --notes-file notas.md $BETA
      - name: Publicar o índice (os apps passam a ver a versão nova)
        run: |
          cd downloads
          git config user.name "Yoru Lançamento"
          git config user.email "yoru-lancamento@users.noreply.github.com"
          git add latest
          git commit -m "Yoru $VERSAO"
          git push

  site:
    needs: [verificar, publicar]
    if: needs.verificar.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.verificar.outputs.commit }}
          ssh-key: ${{ secrets.YORU_SOURCE_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      # versões do código sem o wrangler.jsonc (até a 1.3.0-beta.1) não sabem ir para a Cloudflare: só o Firebase
      - name: Publicar na Cloudflare (beta vai para beta.yoruapp.com.br)
        if: needs.verificar.outputs.cloudflare == 'true' && hashFiles('wrangler.jsonc') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "$VERSAO" in
            *-beta.*) npx --yes wrangler@4.150.0 deploy --env beta ;;
            *) npx --yes wrangler@4.150.0 deploy ;;
          esac
      - name: Publicar no Firebase (beta vai para o site beta)
        if: needs.verificar.outputs.firebase == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_YORU__APP }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"
          case "$VERSAO" in
            *-beta.*) node -e "const f='firebase.json';const c=JSON.parse(require('fs').readFileSync(f));c.hosting.site='yoru-call-beta';require('fs').writeFileSync(f,JSON.stringify(c,null,2))" ;;
          esac
          npx --yes firebase-tools@15.31.0 deploy --only hosting --project yoru--app --non-interactive
          rm -f "$RUNNER_TEMP/firebase.json"
